<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>猫写真 AI確認シート</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eee8de;color:#2f2923;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:2;background:rgba(255,252,247,.96);border-bottom:1px solid #d8cdbd;padding:10px 18px}
h1{font-size:18px;margin:0}.range{font-size:14px;font-weight:700;margin-left:12px}
main{max-width:1320px;margin:0 auto;padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{margin:0;background:#fff;border:1px solid #d8cdbd;border-radius:10px;overflow:hidden}
.card img{display:block;width:100%;height:360px;object-fit:contain;background:#151515}
.card figcaption{font-size:20px;font-weight:800;text-align:center;padding:5px}
@media(max-width:700px){main{grid-template-columns:1fr}.card img{height:70svh}}
</style>
</head>
<body>
<header><h1>猫写真 AI確認シート <span class="range" id="range"></span></h1></header>
<main id="grid"></main>
<script>
var N=178;
var q=new URLSearchParams(location.search);
var start=Math.max(0,Math.min(N-1,parseInt(q.get("start")||"0",10)||0));
var count=Math.max(1,Math.min(12,parseInt(q.get("count")||"9",10)||9));
var end=Math.min(N,start+count);
var pad=function(n){return ("00"+n).slice(-3);};
var grid=document.getElementById("grid");
for(var i=start;i<end;i++){
  var fig=document.createElement("figure");
  fig.className="card";
  fig.innerHTML='<img src="img/album/f'+pad(i)+'.webp" alt="f'+pad(i)+'"><figcaption>f'+pad(i)+' / '+i+'</figcaption>';
  grid.appendChild(fig);
}
document.getElementById("range").textContent=start+"〜"+(end-1);
</script>
</body>
</html>
